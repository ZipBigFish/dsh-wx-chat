<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="微信风聊天：微信式气泡、按工具切换头像、可存成头像方案的 DSH 聊天外观插件">
  <title>微信风聊天 · DSH 聊天外观插件</title>
  <desc>左侧标题「微信风聊天」，右侧为左右两列的聊天气泡布局示意。</desc>

  <defs>
    <linearGradient id="wxhero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFDFF"/>
      <stop offset="0.55" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#EAF1FC"/>
    </linearGradient>
    <linearGradient id="wxhero-topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#95EC69"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="450" fill="url(#wxhero-bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#wxhero-topbar)" opacity="0.9"/>

  <!-- 柔光：纯色半透明，不用滤镜，缩小后也不糊成一团 -->
  <circle cx="1010" cy="40" r="230" fill="#DDE8FB" opacity="0.55"/>
  <circle cx="150" cy="440" r="190" fill="#E4F7E0" opacity="0.5"/>
  <circle cx="640" cy="430" r="120" fill="#EAF0FD" opacity="0.6"/>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <!-- 品牌徽标：沿用 icon.svg 的靛蓝圆 + 白气泡 + 青绿小气泡 -->
    <g transform="translate(88 66)">
      <rect x="0" y="0" width="58" height="58" rx="16" fill="#4D6BFE"/>
      <path d="M13 19h23a9 9 0 0 1 9 9v1a9 9 0 0 1-9 9H21l-7 6 2-8a9 9 0 0 1-3-6.7z" fill="#FFFFFF" opacity="0.97"/>
      <path d="M36 27h9a3.6 3.6 0 0 1 3.6 3.6v0.4a3.6 3.6 0 0 1-3.6 3.6h-5l-3.6 3 0.9-4a3.6 3.6 0 0 1-1.3-2.6z" fill="#95EC69"/>
      <circle cx="20" cy="28.5" r="1.6" fill="#4D6BFE"/>
      <circle cx="26" cy="28.5" r="1.6" fill="#4D6BFE"/>
      <circle cx="32" cy="28.5" r="1.6" fill="#4D6BFE"/>
    </g>

    <!-- 标题：窄屏等比缩小时仍是最醒目的元素 -->
    <text x="88" y="232" font-size="80" font-weight="700" fill="#27357A">微信风聊天</text>
    <text x="88" y="288" font-size="24" fill="#55658E">DeepSeek Harness 桌面版的聊天外观插件</text>
    <text x="88" y="324" font-size="24" fill="#55658E">微信式气泡 · 按工具切换头像 · 存成方案</text>

    <g transform="translate(88 350)">
      <rect x="0" y="0" width="104" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0FB" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4" fill="#95EC69"/>
      <text x="34" y="22" font-size="14" fill="#4A5A86">v2.9.1</text>
    </g>

    <!-- 右侧：聊天气泡布局示意（不写真截图，不复制私人聊天与头像） -->
    <g>
      <!-- 助手行：左头像 + 左气泡 -->
      <circle cx="668" cy="166" r="23" fill="#4D6BFE"/>
      <path d="M655 155h16a7 7 0 0 1 7 7v1a7 7 0 0 1-7 7h-11l-5 4.2 1.4-5.2a7 7 0 0 1-1.4-4z" fill="#FFFFFF" opacity="0.97"/>
      <rect x="706" y="114" width="342" height="104" rx="20" fill="#FFFFFF" stroke="#D9E4F8" stroke-width="1.5"/>
      <rect x="732" y="144" width="212" height="11" rx="5.5" fill="#E4EBF8"/>
      <rect x="732" y="166" width="250" height="11" rx="5.5" fill="#E4EBF8"/>
      <rect x="732" y="188" width="148" height="11" rx="5.5" fill="#E4EBF8"/>

      <!-- 用户行：右气泡 + 右头像（青绿气泡点缀，与 icon 的小气泡同色系） -->
      <rect x="752" y="246" width="292" height="92" rx="20" fill="#DCF8C6" stroke="#BCE5A2" stroke-width="1.5"/>
      <rect x="776" y="272" width="182" height="11" rx="5.5" fill="#AFD991"/>
      <rect x="776" y="294" width="214" height="11" rx="5.5" fill="#AFD991"/>
      <circle cx="1084" cy="292" r="23" fill="#95EC69"/>
      <text x="1084" y="300" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">我</text>
    </g>

    <!-- 明确标注这是布局示意，不是真实截图 -->
    <text x="1084" y="400" font-size="14" fill="#7C8AAF" text-anchor="end">聊天布局示意 · 非真实截图</text>
  </g>
</svg>
